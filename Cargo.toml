[package]
name = "playsuipi_core"
version = "1.2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[[bin]]
name = "playsuipi_game"
path = "src/main.rs"

[dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
rand = "0.10"
rand_chacha = "0.10.0"
wasm-bindgen = "0.2"
